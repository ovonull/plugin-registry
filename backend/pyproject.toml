[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pluginhub-backend"
version = "0.1.0"
description = "PlugHub 插件库后端：插件分发、审核与索引服务"
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "cryptography>=45.0.0,<47.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "redis>=5.0.0,<7.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.setuptools]
packages = [
  "app",
  "app.common",
  "app.models",
  "app.routes",
  "app.services",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
