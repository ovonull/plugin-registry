name: pluginhub

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/ovonull/pluginhub-backend}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pluginhub-backend
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HOST: 0.0.0.0
      PORT: 8000
      # 默认使用 SQLite，数据库文件落在挂载的 data 目录里；
      # 改成 MySQL 时在 .env 覆盖 DATABASE_URL 并启动 mysql profile。
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/plugin_registry.db}
    volumes:
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)); raise SystemExit(0 if data.get('success') else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pluginhub-network

  mysql:
    # 默认不启动：平台默认使用 SQLite。需要 MySQL 时执行
    # docker compose --profile mysql up -d，并在 .env 里把 DATABASE_URL 换成 MySQL 连接串。
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: pluginhub-mysql
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-napcat}
      MYSQL_USER: ${MYSQL_USER:-napcat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - pluginhub-network

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/ovonull/pluginhub-frontend}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pluginhub-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5178}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"success\":true'"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pluginhub-network

networks:
  pluginhub-network:
    name: pluginhub-network
